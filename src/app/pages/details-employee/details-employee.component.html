<h2>Details of employee's ID : <mark>{{employee.id}}</mark></h2>


<div class="card">
  <ul class="list-group list-group-flush">
    <li class="list-group-item">
      <th>First Name</th>
      <td>{{employee.firstName}}</td>
    </li>
    <li class="list-group-item">
      <th>Last Name</th>
      <td>{{employee.lastName}}</td>
    </li>
    <li class="list-group-item">
      <th>Email id</th>
      <td>{{employee.email}}</td>
    </li>
  </ul>
</div>
